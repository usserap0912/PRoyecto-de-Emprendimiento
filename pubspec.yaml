name: safezone
description: "SafeZone - Red Vecinal de Seguridad, Collique, Comas"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
  shimmer: ^3.0.0
  video_player: ^2.8.6
  permission_handler: ^12.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  flutter_map: ^8.3.2
  firebase_core: 4.14.0
  firebase_messaging: 16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/animations/
    - assets/sos/
    - assets/territory/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# ==========================================================
# CONFIGURACIÓN DEL ICONO DE LA APP
# ==========================================================
# Genera los mipmap para Android con el logo de SafeZone.
# Ejecutar: dart run flutter_launcher_icons
# ==========================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo-app.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icons/logo-app.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
