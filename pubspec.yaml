name: safezone
description: "SafeZone - Red Vecinal de Seguridad, Collique, Comas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  video_player: ^2.8.6
  permission_handler: ^12.0.3
  flutter_map_marker_cluster: ^1.4.0
  dart_openai: ^6.1.1
  rive: ^0.14.9
  http: ^1.6.0
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/animations/

# ==========================================================
# CONFIGURACIÓN DEL ICONO DE LA APP
# ==========================================================
# Genera los mipmap para Android con el logo de SafeZone.
# Ejecutar: dart run flutter_launcher_icons
# ==========================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo-app.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icons/logo-app.png"
  min_sdk_android: 21
