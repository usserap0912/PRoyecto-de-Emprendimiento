  shimmer: ^3.0.0
  video_player: ^2.8.6
  permission_handler: ^12.0.3
  flutter_map_marker_cluster: ^1.4.0
  dart_openai: ^6.1.1
  rive: ^0.14.9
  flutter_stripe: ^13.0.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1

dev_dependencies:
