name: safezone
description: "SafeZone - Red Vecinal de Seguridad, Collique, Comas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
